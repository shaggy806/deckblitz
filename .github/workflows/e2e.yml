name: E2E

on:
  push:
    branches: [main]
  pull_request:
  # The whole suite, tutorials and larger screens included, on a push to main
  # as well as daily (2026-11-14: a push used to run only the quick set, so a
  # deploy ran the full suite locally first, 18 minutes; here it's ~3-4
  # minutes more than the quick set, beside CI). A pull request runs the quick
  # set (client/package.json).
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

# By event, so a push never cancels a scheduled run of the whole suite.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Playwright's own image, with Chromium and the system packages it needs
    # already in it (2026-11-18). `npx playwright install --with-deps chromium`
    # on the bare runner took 20 seconds in some jobs and 2 to 10 minutes in
    # others, in every run: Chromium came down in seconds, but its packages
    # came from an Ubuntu mirror that was often slow (32 MB at 112 kB/s), and
    # the slowest job is what a deploy waits for. The image is up in 20 to 30
    # seconds every time. Its tag is the version of `@playwright/test` in
    # client/package.json: a step below stops the job, saying so, when the
    # two part ways.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      # The runner's own user, so the checkout is this user's to write.
      options: --user 1001
    # dev-rooms' rooms on the main thread (0) and on a worker thread (1), as
    # the server's --shards runs them (docs/plans/room-shards.md), each in
    # five parts side by side. One job a mode ran the whole suite one test
    # after another — the tests share one dev-rooms, so a job can't run two at
    # once — and took 22-25 minutes, which a deploy waited out (2026-11-17).
    # Every part starts its own dev-rooms.
    #
    # The parts are dealt by `client/e2e/shard.mjs`, by how long each spec
    # file takes, so they end together (2026-11-18): Playwright's `--shard`
    # goes by test counts in name order, which gave four parts 250, 270, 450
    # and 550 seconds of tests. Five and not six: with CI's jobs beside them
    # that is nineteen at once, under the twenty an account runs at a time.
    #
    # Each part builds engine, protocol and server itself (70 s). One job
    # building for all of them was tried the same day and took longer to the
    # first test: its own minute and three quarters before any part started,
    # then the download. Minutes cost nothing on a public repository; the wait
    # is what counts.
    strategy:
      fail-fast: false
      matrix:
        shards: [0, 1]
        part: [1, 2, 3, 4, 5]
    name: smoke (shards ${{ matrix.shards }}, part ${{ matrix.part }} of 5)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The image's Playwright is the one installed
        working-directory: client
        run: |
          installed=$(npx playwright --version | sed 's/^Version //')
          if [ "$installed" != "1.56.1" ]; then
            echo "@playwright/test is $installed, but this job runs in mcr.microsoft.com/playwright:v1.56.1-noble."
            echo "Change the image's tag in .github/workflows/e2e.yml to v$installed-noble (and this check with it)."
            exit 1
          fi
      # dev-rooms imports engine, protocol and server from their dist/.
      - run: npm run build -w engine && npm run build -w protocol && npm run build -w server
      # Starts dev-rooms and the Vite dev server itself (client/playwright.config.ts).
      # A pull request runs the quick set, which skips some files whole.
      - name: The part's spec files
        id: files
        working-directory: client
        run: echo "list=$(node e2e/shard.mjs ${{ matrix.part }} 5 ${{ github.event_name == 'pull_request' && '--quick' || '' }})" >> "$GITHUB_OUTPUT"
      - run: npm run ${{ github.event_name != 'pull_request' && 'test:e2e:full' || 'test:e2e' }} -w client -- --pass-with-no-tests ${{ steps.files.outputs.list }}
        env:
          DEV_ROOMS_SHARDS: ${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shards-${{ matrix.shards }}-part-${{ matrix.part }}
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
