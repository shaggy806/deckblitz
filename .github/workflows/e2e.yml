name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # dev-rooms' rooms on the main thread (0) and on a worker thread (1), as
    # the server's --shards runs them (docs/plans/room-shards.md).
    strategy:
      fail-fast: false
      matrix:
        shards: [0, 1]
    name: smoke (shards ${{ matrix.shards }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dev-rooms imports engine, protocol and server from their dist/.
      - run: npm run build -w engine && npm run build -w protocol && npm run build -w server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # Starts dev-rooms and the Vite dev server itself (client/playwright.config.ts).
      - run: npm run test:e2e -w client
        env:
          DEV_ROOMS_SHARDS: ${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shards-${{ matrix.shards }}
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
