name: E2E

on:
  push:
    branches: [main]
  pull_request:
  # The whole suite, tutorials and larger screens included, on a push to main
  # as well as daily (2026-11-14: a push used to run only the quick set, so a
  # deploy ran the full suite locally first, 18 minutes; here it's ~3-4
  # minutes more than the quick set, beside CI). A pull request runs the quick
  # set (client/package.json).
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

# By event, so a push never cancels a scheduled run of the whole suite.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # dev-rooms' rooms on the main thread (0) and on a worker thread (1), as
    # the server's --shards runs them (docs/plans/room-shards.md), each in
    # four parts side by side (Playwright's --shard, which deals out the spec
    # files by their test counts). One job a mode ran the whole suite one test
    # after another — the tests share one dev-rooms, so a job can't run two at
    # once — and took 22-25 minutes, which a deploy waited out; CI beside it
    # is done in nine (2026-11-17). Every part starts its own dev-rooms.
    strategy:
      fail-fast: false
      matrix:
        shards: [0, 1]
        part: [1, 2, 3, 4]
    name: smoke (shards ${{ matrix.shards }}, part ${{ matrix.part }} of 4)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dev-rooms imports engine, protocol and server from their dist/.
      - run: npm run build -w engine && npm run build -w protocol && npm run build -w server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # Starts dev-rooms and the Vite dev server itself (client/playwright.config.ts).
      - run: npm run ${{ github.event_name != 'pull_request' && 'test:e2e:full' || 'test:e2e' }} -w client -- --shard=${{ matrix.part }}/4
        env:
          DEV_ROOMS_SHARDS: ${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shards-${{ matrix.shards }}-part-${{ matrix.part }}
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
